[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "corda-synth"
version = "0.1.0"
description = "Corda Protocol (.crd) Speech Synthesis Engine"
readme = "ROADMAP.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pymongo>=4.0",
    "soundfile>=0.12",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
corda-synth = "corda_synth.cli:main"

[tool.setuptools.packages.find]
include = ["corda_synth*"]
exclude = ["corpus*", "tests*"]
